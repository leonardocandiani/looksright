<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A page with planted problems</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #ffffff; color: #1a1a1a; }
    main { padding: 24px; }

    /* Wider than any phone: the page will scroll sideways. */
    .too-wide { width: 720px; background: #eee; padding: 12px; margin-bottom: 16px; }

    /* Grey on white, around 2.3:1. Below AA either way. */
    .faint { color: #b9b9b9; }

    /* Same colour as the ground it sits on. */
    .ghost { color: #fdfdfd; background: #fdfdfd; }

    /* Nowrap plus hidden, without ellipsis: the sentence just stops. */
    .cut { width: 160px; white-space: nowrap; overflow: hidden; }

    .tiny { width: 22px; height: 22px; padding: 0; font-size: 10px; }

    .spinner {
      width: 32px; height: 32px; border: 4px solid #ddd; border-top-color: #333;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <h1>Planted problems</h1>

    <div class="too-wide">This block is 720px wide, so a phone scrolls sideways.</div>

    <p class="faint">This paragraph is light grey on white and fails AA contrast.</p>

    <p class="ghost">This sentence is the same colour as its own background.</p>

    <p class="cut">This sentence is clipped by its container and has no ellipsis to warn anyone.</p>

    <button class="tiny" aria-label="Close">x</button>

    <button><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#666"/></svg></button>

    <input type="text" placeholder="Your email">

    <img src="/this-image-does-not-exist.png" width="80" height="60">

    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="40" height="40">

    <div class="spinner" aria-label="Loading"></div>
    <p id="loading-text">Loading...</p>

    <iframe src="about:blank" width="120" height="60"></iframe>
  </main>

  <script>
    // A real console error, the kind a broken build leaves behind.
    setTimeout(() => { console.error('TypeError: cannot read properties of undefined (reading "map")'); }, 50);
    fetch('/api/missing-endpoint').catch(() => {});
  </script>
</body>
</html>
